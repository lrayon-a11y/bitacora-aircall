name: Actualizar Bitacora Aircall

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso explícito de escritura

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt

    - name: Ejecutar script de Python
      env:
        AIRCALL_API_ID: ${{ secrets.AIRCALL_API_ID }}
        AIRCALL_API_TOKEN: ${{ secrets.AIRCALL_API_TOKEN }}
      run: |
        python reporte_aircall.py

    - name: Desplegar en GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
